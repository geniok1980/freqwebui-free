# FreqDash Observability — конфигурация Prometheus
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: freqdash-exporter
    static_configs:
      - targets: ["exporter:9101"]
        labels:
          service: freqdash

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
